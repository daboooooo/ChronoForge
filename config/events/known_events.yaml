# 已知发布事件日历（FOMC / CPI / NFP）
#
# 用途：日报「前瞻 ⑤ 下一次已知事件」从本文件读取，不再手工写在模板里。
# 维护规则（不允许推算填充）：
# - 只写官方日程页上已公布的日期；页面未列出的月份留空并在此说明，不按周几推算。
# - 每个来源记录 URL 与访问日期（accessed_at）；as_of 表示本配置整理时的数据时点。
# - 状态语义：confirmed=官方日程已公布且临近会议已确认；tentative=官方已列出但
#   尚未在会议前确认（美联储 2027 年日期即按此标注）。
# - 日历会变：BLS 可能因拨款中断/统计推迟改期，美联储日期在会前仍可能微调；
#   每次修订请同步更新 accessed_at 并重跑报告。
#
# 来源（2026-11-08 访问）：
# - 美联储 FOMC 日历：2026 年 8 次日期已公布，2027 年日期也已列出，
#   页面注明 "Each meeting date is tentative until confirmed at the meeting
#   immediately preceding it"，故 2027 年全部标 tentative。
# - BLS CPI 日程页：已滚动覆盖 2026-10 至 2027-12 的参考月发布日。
# - BLS 就业形势（NFP）日程页：已滚动覆盖 2026-10 至 2027-11 的参考月发布日。
#   BLS 按发布日程页滚动给出，本文件不补未公布月份；若后续页面未覆盖，留空即可。
#
# 时间均为美国东部时间（ET）；FOMC 取会议第二天（决议/声明日）14:00，
# CPI 与 NFP 取 08:30。

version: "1"
as_of: "2026-11-08"

sources:
